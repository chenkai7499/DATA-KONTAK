<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pencarian Kontak Spreadsheet</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; background: #f6f7fb; color: #111; }
    .card { max-width: 900px; margin: 0 auto; background: #fff; border: 1px solid #e6e8ef; border-radius: 10px; padding: 20px; }
    h1 { margin: 0 0 12px; font-size: 1.35rem; }
    .muted { color: #555; font-size: 0.92rem; margin-bottom: 12px; }
    textarea { width: 100%; min-height: 180px; padding: 10px; border: 1px solid #cfd4e3; border-radius: 8px; resize: vertical; box-sizing: border-box; }
    .actions { display: flex; gap: 8px; margin-top: 10px; }
    button { padding: 10px 14px; border: 0; border-radius: 8px; cursor: pointer; }
    #searchBtn { background: #2563eb; color: #fff; }
    #clearBtn { background: #e5e7eb; color: #111; }
    button:disabled { background: #94a3b8; color: #fff; cursor: wait; }
    table { width: 100%; border-collapse: collapse; margin-top: 14px; }
    th, td { border-bottom: 1px solid #eceff7; padding: 10px 8px; text-align: left; font-size: 0.95rem; }
    th { background: #f8f9fd; }
    .status { margin-top: 10px; font-size: 0.92rem; color: #444; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Pencarian ID / Nomor Kontak (DB1 + DB2)</h1>
    <p class="muted">Masukkan 1 atau banyak data (pisah baris). Sistem akan deteksi otomatis ID atau nomor kontak.</p>

    <textarea id="searchInput" placeholder="Bulk: pisahkan dengan ENTER, spasi, atau koma.\nContoh: tigergank 6282196026865, bajing122722"></textarea>
    <div class="actions">
      <button id="searchBtn">Cari</button>
      <button id="clearBtn" type="button">Clear / Reset</button>
    </div>

    <p id="status" class="status">Siap digunakan.</p>

    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Nomor Kontak</th>
          <th>Kode Kontak</th>
          <th>Asal Sheet</th>
        </tr>
      </thead>
      <tbody id="resultBody">
        <tr><td colspan="4">Belum ada pencarian.</td></tr>
      </tbody>
    </table>
  </main>

  <script>
    const SPREADSHEET_ID = "GANTI_DENGAN_SPREADSHEET_ID";
    const SHEETS = ["DB1", "DB2"];

    const statusEl = document.getElementById("status");
    const resultBody = document.getElementById("resultBody");
    const searchInput = document.getElementById("searchInput");
    const searchBtn = document.getElementById("searchBtn");
    const clearBtn = document.getElementById("clearBtn");

    let cachedRows = [];

    function escapeHtml(text) {
      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/\"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function toCsvUrl(sheetName) {
      return `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheetName)}`;
    }

    function parseCsvLine(line) {
      const out = [];
      let cur = "";
      let quoted = false;
      for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        if (ch === '"') {
          if (quoted && line[i + 1] === '"') { cur += '"'; i++; }
          else { quoted = !quoted; }
        } else if (ch === "," && !quoted) {
          out.push(cur); cur = "";
        } else {
          cur += ch;
        }
      }
      out.push(cur);
      return out;
    }

    function csvToRows(csv) {
      return csv.split(/\r?\n/).filter(Boolean).map(parseCsvLine);
    }

    async function loadData() {
      if (SPREADSHEET_ID === "GANTI_DENGAN_SPREADSHEET_ID") {
        throw new Error("Silakan isi SPREADSHEET_ID di file index.html terlebih dahulu.");
      }
      const all = await Promise.all(
        SHEETS.map(async (sheetName) => {
          const res = await fetch(toCsvUrl(sheetName));
          if (!res.ok) throw new Error(`Gagal mengambil data dari ${sheetName}.`);
          const rows = csvToRows(await res.text());
          return rows
            .filter((r, idx) => idx > 0 && r.length >= 3)
            .map((r) => ({
              id: (r[0] || "").trim(),
              nomorKontak: (r[1] || "").trim(),
              kodeKontak: (r[2] || "").trim(),
              asalSheet: sheetName,
            }));
        })
      );
      return all.flat();
    }

    function renderRows(rows) {
      if (!rows.length) {
        resultBody.innerHTML = '<tr><td colspan="4">Data tidak ditemukan.</td></tr>';
        return;
      }
      resultBody.innerHTML = rows.map((r) => `
        <tr>
          <td>${escapeHtml(r.id)}</td>
          <td>${escapeHtml(r.nomorKontak)}</td>
          <td>${escapeHtml(r.kodeKontak)}</td>
          <td>${escapeHtml(r.asalSheet)}</td>
        </tr>`).join("");
    }

    function tokenizeInput(raw) {
      if (raw == null) return [];
      return String(raw)
        .split(/[\s,]+/)
        .map((v) => String(v || "").trim())
        .filter(Boolean);
    }

    function normalizeId(value) {
      return String(value || "").trim().toLowerCase();
    }

    function normalizePhone(value) {
      return String(value || "").replace(/\D/g, "");
    }

    function hasLetter(token) {
      return /[a-z]/i.test(String(token || ""));
    }

    function isNumericToken(token) {
      return /^\d+$/.test(String(token || "").trim());
    }

    function searchMany() {
      const tokens = tokenizeInput(searchInput.value);
      if (!tokens.length) {
        statusEl.textContent = "Masukkan minimal 1 ID atau nomor kontak.";
        renderRows([]);
        return;
      }

      const idSet = new Set();
      const phoneSet = new Set();

      for (const token of tokens) {
        const cleanToken = String(token || "").trim();
        if (!cleanToken) continue;

        if (hasLetter(cleanToken)) {
          idSet.add(normalizeId(cleanToken));
          continue;
        }

        if (isNumericToken(cleanToken)) {
          const normalizedPhone = normalizePhone(cleanToken);
          if (normalizedPhone) phoneSet.add(normalizedPhone);
        }
      }

      const seen = new Set();
      const results = [];

      for (const row of cachedRows) {
        const idHit = idSet.has(normalizeId(row.id));
        const rowPhone = normalizePhone(row.nomorKontak);
        const phoneHit = phoneSet.has(rowPhone);

        if (idHit || phoneHit) {
          const key = `${row.asalSheet}::${row.id}::${row.nomorKontak}::${row.kodeKontak}`;
          if (!seen.has(key)) {
            seen.add(key);
            results.push(row);
          }
        }
      }

      statusEl.textContent = `Input: ${tokens.length} | Hasil ditemukan: ${results.length}`;
      renderRows(results);
    }

    function clearAll() {
      searchInput.value = "";
      statusEl.textContent = "Input dibersihkan.";
      resultBody.innerHTML = '<tr><td colspan="4">Belum ada pencarian.</td></tr>';
      searchInput.focus();
    }

    async function init() {
      searchBtn.disabled = true;
      statusEl.textContent = "Memuat data DB1 dan DB2...";
      try {
        cachedRows = await loadData();
        statusEl.textContent = `Data siap. Total ${cachedRows.length} baris termuat.`;
      } catch (err) {
        statusEl.textContent = err.message;
      } finally {
        searchBtn.disabled = false;
      }
    }

    searchBtn.addEventListener("click", searchMany);
    clearBtn.addEventListener("click", clearAll);

    init();
  </script>
</body>
</html>
